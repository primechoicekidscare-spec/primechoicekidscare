<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffaf0">
    <title>Page not found | Prime Choice Kids Care</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="stylesheet" href="./styles.css">
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; padding: 30px 18px; background: var(--cream); text-align: center; }
      .not-found-card { max-width: 540px; }
      .not-found-mark { color: var(--orange); font-size: 54px; }
      .not-found h1 { margin: 0 0 10px; font: 900 clamp(34px, 8vw, 52px)/1.1 var(--heading); letter-spacing: -1.5px; }
      .not-found p { margin: 0 auto 24px; color: var(--ink-soft); }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="not-found-card">
        <div class="not-found-mark" aria-hidden="true">✿</div>
        <h1>Oops, that page wandered off.</h1>
        <p>The page you are looking for isn't here. Let's head back to a place for little minds to grow.</p>
        <a class="button button-orange" href="./index.html">Back to the homepage <span aria-hidden="true">↗</span></a>
      </div>
    </main>
  </body>
</html>
